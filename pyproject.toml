[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sync"
version = "0.4.0"
description = "Explicit, reviewable assistant knowledge synchronization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-sync = "agent_sync.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_sync*"]
